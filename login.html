<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - طريق الهدى</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 40px 20px;">
        <div class="auth-card" style="background: #ffffff; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 24px; color: var(--primary-color, #0f4c5c);">Welcome Back</h2>
            
            <form id="login-form" onsubmit="handleLogin(event, 'login-form')">
                <div style="margin-bottom: 18px;">
                    <label for="username" style="display: block; margin-bottom: 6px; font-weight: 500; color: #333;">Username</label>
                    <input type="text" id="username" name="username" required style="width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
                </div>
                
                <div style="margin-bottom: 24px;">
                    <label for="password" style="display: block; margin-bottom: 6px; font-weight: 500; color: #333;">Password</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
                </div>
                
                <button type="submit" class="auth-btn-signup" style="width: 100%; padding: 12px; border: none; cursor: pointer; border-radius: 6px; font-size: 16px; font-weight: 500; text-align: center;">Login</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #666;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color, #0f4c5c); font-weight: 500; text-decoration: none;">Register</a>
            </p>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="assets/js/component-loader.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
