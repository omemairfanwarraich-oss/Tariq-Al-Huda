<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Note</title>
     <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
    <link rel="stylesheet" href="assets/css/style.css?v=11">
    <style>
        /* Send icon button styling */
        .send-icon-btn {
            width: 48px;
            height: 48px;
            min-height: 48px;
            padding: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform var(--ease-smooth), background var(--ease-smooth);
        }
        .send-icon-btn svg {
            transition: transform var(--ease-smooth);
        }
        .send-icon-btn:hover svg {
            transform: translateX(2px) translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container viewer-content">
        <a id="back-link" href="pdfs.html" class="back-link">← Back</a>
        <section id="viewer-state" class="empty-state">Loading note...</section>

        <article id="note-viewer" class="note-viewer" hidden>
            <header class="note-header">
                <div>
                    <span class="eyebrow">PDF NOTE</span>
                    <h1 class="section-header" id="note-title"></h1>
                    <p id="note-description" style="color: var(--gold-bright);"></p>
                    <span id="note-file-name" class="note-file-name"></span>
                </div>
                <div class="note-id">Document ID: <span id="note-id"></span></div>
            </header>
            <div class="pdf-frame-wrap">
                <iframe id="pdf-frame" title="PDF document" loading="lazy"></iframe>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                <a id="pdf-fallback" class="button button-secondary" target="_blank" rel="noopener">Open PDF in a new tab <span aria-hidden="true">↗</span></a>
                <a id="pdf-download" class="button button-secondary" download>Download PDF <span aria-hidden="true">↓</span></a>
            </div>
        </article>

        <section id="discussion-section" class="discussion-section" hidden>
            <div class="section-heading-row">
                <div>
                    <span class="eyebrow">COMMUNITY DISCUSSION</span>
                    <h2>Talk about this note</h2>
                </div>
                <span id="discussion-count" class="discussion-count"></span>
            </div>
            <div id="discussion-list" class="discussion-list chat-thread"></div>
            <div id="discussion-login-notice" class="discussion-login-notice" hidden>
                <p>Login to send or view messages.</p>
                <a class="button button-primary button-small" href="login.html">Login</a>
            </div>
            <form id="discussion-form" class="discussion-form">
                <label for="discussion-message">Your message</label>
                <div class="discussion-input-row">
                    <textarea id="discussion-message" maxlength="1000" rows="2" required placeholder="Share a question or helpful reflection..."></textarea>
                    <button type="submit" class="button button-primary send-icon-btn" aria-label="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="discussion-form-footer">
                    <span id="discussion-login-hint" class="form-hint"></span>
                </div>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assets/js/component-loader.js"></script>
    <script src="assets/js/auth.js?v=6"></script>
    <script>
        const pdfId = new URLSearchParams(window.location.search).get('id');
        const viewerState = document.getElementById('viewer-state');
        const noteViewer = document.getElementById('note-viewer');
        const discussionSection = document.getElementById('discussion-section');
        const discussionList = document.getElementById('discussion-list');
        const discussionForm = document.getElementById('discussion-form');
        let discussionRefreshTimer;

        function showError(message) {
            viewerState.textContent = message;
            viewerState.className = 'empty-state error-state';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        async function loadNote() {
            if (!pdfId) {
                showError('No document ID was provided.');
                return;
            }

            try {
                const response = await fetch(`/api/pdfs/${encodeURIComponent(pdfId)}`);
                if (!response.ok) throw new Error('Note not found.');
                const pdf = await response.json();
                document.title = `${pdf.title} - طريق الهدى`;
                document.getElementById('note-title').textContent = `${pdf.id} - ${pdf.title}`;
                document.getElementById('note-description').textContent = pdf.description;
                document.getElementById('note-id').textContent = pdf.id;
                document.getElementById('note-file-name').textContent = pdf.file_name ? `Original file: ${pdf.file_name}` : '';
                const fileUrl = `/api/pdfs/${encodeURIComponent(pdf.id)}/file`;
                document.getElementById('pdf-frame').src = fileUrl;
                document.getElementById('pdf-fallback').href = fileUrl;
                document.getElementById('pdf-download').href = fileUrl;
                viewerState.hidden = true;
                noteViewer.hidden = false;
                discussionSection.hidden = false;
                if (localStorage.getItem('access_token')) {
                    fetch(`/api/recent-pdfs/${encodeURIComponent(pdf.id)}`, {method: 'POST', headers: {Authorization: `Bearer ${localStorage.getItem('access_token')}`}});
                }
                if (localStorage.getItem('access_token')) {
                    await loadDiscussions();
                } else {
                    discussionList.hidden = true;
                    discussionForm.hidden = true;
                    document.getElementById('discussion-count').hidden = true;
                    document.getElementById('discussion-login-notice').hidden = false;
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadDiscussions() {
            try {
                const response = await fetch(`/api/discussions/${encodeURIComponent(pdfId)}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                });
                if (!response.ok) return;
                const discussions = await response.json();
                document.getElementById('discussion-count').textContent = `${discussions.length} message${discussions.length === 1 ? '' : 's'}`;
                
                const currentUser = localStorage.getItem('username');
                const isAdmin = localStorage.getItem('is_admin') === 'true';
                
                const existingIds = Array.from(discussionList.querySelectorAll('[data-chat-id]')).map(el => el.dataset.chatId);
                const incomingIds = discussions.map(d => String(d.id));

                const hasChanges = incomingIds.length !== existingIds.length || incomingIds.some((id, i) => id !== existingIds[i]);

                if (hasChanges) {
                    const isScrolledToBottom = discussionList.scrollHeight - discussionList.scrollTop <= discussionList.clientHeight + 50;
                    const isOnlyAppend = incomingIds.length > existingIds.length && existingIds.every((id, i) => id === incomingIds[i]);

                    if (isOnlyAppend) {
                        const newDiscussions = discussions.slice(existingIds.length);
                        const emptyState = discussionList.querySelector('.empty-state');
                        if (emptyState) emptyState.remove();

                        newDiscussions.forEach(discussion => {
                            const isOwn = discussion.user_name === currentUser;
                            const article = document.createElement('article');
                            article.className = `chat-message ${isOwn ? 'chat-message-own' : ''}`;
                            article.setAttribute('data-chat-id', discussion.id);
                            article.innerHTML = `
                                <div class="chat-bubble">
                                    <div class="message-header">
                                        <strong class="message-author">${discussion.is_admin ? '<span class="admin-label">Admin</span> ' : ''}${escapeHtml(discussion.user_name)}</strong>
                                    </div>
                                    <p>${escapeHtml(discussion.message)}</p>
                                    <div class="message-footer">
                                        ${isAdmin ? `<button class="chat-delete" type="button" data-delete-chat="${escapeHtml(discussion.id)}">Delete</button>` : ''}
                                    </div>
                                </div>
                            `;
                            if (isAdmin) {
                                article.querySelector('[data-delete-chat]').addEventListener('click', () => deleteDiscussion(discussion.id));
                            }
                            discussionList.appendChild(article);
                        });
                    } else {
                        const newHTML = discussions.length ? discussions.map(discussion => `
                            <article class="chat-message ${discussion.user_name === currentUser ? 'chat-message-own' : ''}" data-chat-id="${escapeHtml(discussion.id)}">
                                <div class="chat-bubble">
                                    <div class="message-header">
                                        <strong class="message-author">${discussion.is_admin ? '<span class="admin-label">Admin</span> ' : ''}${escapeHtml(discussion.user_name)}</strong>
                                    </div>
                                    <p>${escapeHtml(discussion.message)}</p>
                                    <div class="message-footer">
                                        ${isAdmin ? `<button class="chat-delete" type="button" data-delete-chat="${escapeHtml(discussion.id)}">Delete</button>` : ''}
                                    </div>
                                </div>
                            </article>
                        `).join('') : '<p class="empty-state">No discussion yet. Start the conversation.</p>';

                        discussionList.innerHTML = newHTML;

                        if (isAdmin) {
                            discussionList.querySelectorAll('[data-delete-chat]').forEach(button => {
                                button.addEventListener('click', () => deleteDiscussion(button.dataset.deleteChat));
                            });
                        }
                    }

                    if (isScrolledToBottom && document.activeElement !== document.getElementById('discussion-message')) {
                        discussionList.scrollTop = discussionList.scrollHeight;
                    }
                }
            } catch (err) {
                // Silent background sync error handler
            }
        }

        async function deleteDiscussion(discussionId) {
            if (!confirm('Delete this chat message?')) return;

            const response = await fetch(`/api/discussions/${encodeURIComponent(discussionId)}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
            });
            if (!response.ok) {
                const error = await response.json();
                alert(error.detail || 'Message could not be deleted.');
                return;
            }
            await loadDiscussions();
        }

        discussionForm.addEventListener('submit', async event => {
            event.preventDefault();
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = `login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
                return;
            }

            const messageInput = document.getElementById('discussion-message');
            const messageText = messageInput.value.trim();
            if (!messageText) return;

            const submitButton = discussionForm.querySelector('button');
            submitButton.disabled = true;
            try {
                const response = await fetch('/api/discussions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ pdf_id: pdfId, message: messageText })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Message could not be sent.');
                }
                
                discussionForm.reset();
                await loadDiscussions();

            } catch (error) {
                alert(error.message);
            } finally {
                submitButton.disabled = false;
            }
        });

        document.getElementById('discussion-login-hint').textContent = localStorage.getItem('access_token') ? `Posting as ${localStorage.getItem('username') || 'signed-in user'}` : 'Sign in to join the discussion.';
        loadNote().then(() => {
            if (localStorage.getItem('access_token')) {
                discussionRefreshTimer = window.setInterval(loadDiscussions, 2000);
            }
        });
        window.addEventListener('beforeunload', () => window.clearInterval(discussionRefreshTimer));
    </script>
</body>
</html>
