<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All PDF Notes</title>
     <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
    <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>
    <!-- Reusable Header -->
    <div id="header-placeholder"></div>

    <main class="container pdfs-content">
        <a href="index.html" class="back-link">← Back</a>
        <div class="section-header">
            <h1>All PDF Notes</h1>
            <p style="color: var(--gold-muted);;">Search and browse through the complete repository of Islamic study materials.</p>
        </div>

        <!-- Search Bar -->
        <div class="filter-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes by title or description..." class="search-input" style="color: var(--gold-bright);"">
                <button id="searchButton" class="button button-primary button-small" type="button">Search</button>
            </div>
        </div>

        <!-- Dynamic PDF Cards Container -->
        <div class="pdf-grid" id="pdfGrid">
            <!-- Cards will be injected dynamically via JavaScript -->
        </div>
    </main>

    <!-- Reusable Footer -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/component-loader.js"></script>
    <script src="assets/js/auth.js?v=6"></script>
    <script>
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[character]));
        }

        async function loadAllPdfs() {
            try {
                const response = await fetch('/api/pdfs');
                if (!response.ok) throw new Error('Failed to load notes.');
                const pdfs = await response.json();
                
                const grid = document.getElementById('pdfGrid');
                if (!pdfs.length) {
                    grid.innerHTML = '<p class="empty-state">No notes available.</p>';
                    return;
                }

                grid.innerHTML = pdfs.map(pdf => `
                    <a href="viewer.html?id=${encodeURIComponent(pdf.id)}" class="pdf-card">
                        <span class="pdf-badge">PDF · ID ${escapeHtml(pdf.id)}</span>
                        <h2>${escapeHtml(pdf.title)}</h2>
                        <p>${escapeHtml(pdf.description)}</p>
                        <div class="tile-arrow">Read more <b>→</b></div>
                    </a>
                `).join('');
            } catch (err) {
                document.getElementById('pdfGrid').innerHTML = '<p class="empty-state error-state">Could not load notes.</p>';
            }
        }

        loadAllPdfs();
    </script>
</body>
</html>
