<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طريق الهدى - All PDF Notes</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Reusable Header -->
    <div id="header-placeholder"></div>

    <main class="container pdfs-content">
        <div class="section-header">
            <h1>All PDF Notes</h1>
            <p>Search and browse through the complete repository of Islamic study materials.</p>
        </div>

        <!-- Search Bar -->
        <div class="filter-bar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search notes by title or description..." class="search-input">
            </div>
        </div>

        <!-- Dynamic PDF Cards Container -->
        <div class="pdf-grid" id="pdfGrid">
            <!-- Cards will be injected dynamically via JavaScript -->
        </div>
    </main>

    <!-- Reusable Footer -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/component-loader.js"></script>
    <script src="assets/js/pdfs.js"></script>
</body>
</html>
