<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - طريق الهدى</title>
    <link rel="stylesheet" href="assets/css/style.css?v=6">
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 40px 20px;">
        <div class="auth-card" style="background: linear-gradient(145deg, rgba(20, 48, 91, 0.72), rgba(7, 21, 47, 0.62)); padding: 35px; border-radius: 10px; box-shadow: 0 20px 60px var(--shadow-deep), inset 0 1px 0 rgba(255, 255, 255, 0.07); backdrop-filter: blur(18px) saturate(120%); width: 100%; max-width: 400px; border: 1px solid var(--glass-border);">
            <h2 style="text-align: center; margin-bottom: 24px; color: var(--gold-bright); font-size: 22px; font-weight: bold;">Admin Portal</h2>
            
            <form id="admin-login-form" onsubmit="handleAdminLogin(event, 'admin-login-form')">
                <div style="margin-bottom: 18px;">
                    <label for="username" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--gold);">Admin Username</label>
                    <input type="text" id="username" name="username" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--glass-border); border-radius: 6px; font-size: 14px; background: var(--midnight-blue); color: var(--gold-bright);">
                </div>
                
                <div style="margin-bottom: 24px;">
                    <label for="password" style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--gold);">Password</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--glass-border); border-radius: 6px; font-size: 14px; background: var(--midnight-blue); color: var(--gold-bright);">
                </div>
                
                <button type="submit" class="button button-primary" style="width: 100%; padding: 12px; border: none; cursor: pointer; border-radius: 6px; font-size: 16px; font-weight: 500; text-align: center;">Login to Admin Panel</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                <a href="index.html" style="color: var(--gold); font-weight: 500; text-decoration: none;">← Back to Home</a>
            </p>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="assets/js/component-loader.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
